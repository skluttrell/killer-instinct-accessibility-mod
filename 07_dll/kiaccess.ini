# kiaccess narrator settings (copied next to the DLL into kiaccess\kiaccess.ini)
# verbosity: 0 = label only, 1 = label and position "n of m", 2 = also descriptions (Ctrl+Shift+V cycles at runtime)
verbosity=1
# speech: 0 disables Prism output (the speech.log is still written)
speech=1
# log_events: 1 logs every engine event to kiaccess\speech.log (for reader development; large)
log_events=0
# dump_populate: 1 writes each screen's Populate payload to kiaccess\data\populate_<screen>.json
dump_populate=0

# Opponent radar: a soft stereo pulse during a match. Pan = the side the opponent is on relative to you (Player 1),
# rate = how close the opponent is (closer = faster), pitch = how high the opponent is (in the air = higher).
# radar: 1 on at start, 0 off (Ctrl+Shift+P toggles at any time)
radar=1
# radar_volume: 0-100 (0 silences the radar)
radar_volume=50
# radar_range: horizontal distance (game units) at which the pulse is slowest (fighters start a round 3.0 apart, the
# corners are about 9 apart); radar_height: opponent height for the full octave rise (a normal jump peaks near 2.0)
radar_range=7.0
radar_height=2.0
# radar_min_ms / radar_max_ms: pulse interval at point blank / at radar_range
radar_min_ms=120
radar_max_ms=650
# radar_base_hz: pitch with the opponent on the ground
radar_base_hz=440
# radar_debug: 1 logs both fighters' positions once a second to speech.log (calibration)
radar_debug=0
